name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pandas type stubs
        run: python -m pip install pandas-stubs

      - name: Check Black formatting
        run: python -m black --check scripts tests

      - name: Check import sorting
        run: python -m isort --check-only scripts tests

      - name: Run Flake8
        run: >
          python -m flake8 scripts tests
          --max-line-length=88
          --extend-ignore=E203,W503

      - name: Run Mypy
        run: python -m mypy scripts

      - name: Run unit tests
        run: python -m pytest tests -v